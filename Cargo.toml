[workspace]
members = ["crates/movegen-bytecode"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
publish = false
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/misofm/sui-codegen-rust"

[workspace.dependencies]
movegen-bytecode = { path = "crates/movegen-bytecode", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
bcs = "0.1.6"
hex = "0.4.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
# Ports of Mysten functions keep upstream structure for reviewability.
too_many_lines = "allow"
# `expect`s document invariants established earlier (bounded ULEBs, checked indices).
missing_panics_doc = "allow"
