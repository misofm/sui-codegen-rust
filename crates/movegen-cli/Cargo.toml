[package]
name = "movegen-cli"
description = "The movegen command: refresh the lock from Sui, generate Rust bindings"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "movegen"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
movegen.workspace = true
movegen-bytecode.workspace = true
serde_json.workspace = true
ureq = { version = "3.4", features = ["json"] }

[lints]
workspace = true
